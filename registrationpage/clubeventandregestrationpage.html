         <h2>Register</h1>
            <forms action="post">
                <label for="name for form">NAME:</label>
                <input id="name" name="name for form" type="text" required>

                <label for="email">EMAIL:</label>
                <input id="email" name="EMAIL" type="email" required>

                <label for="pass">PASSWORD:</label>
                <input id="pass" name="pass" type="password" required>

                <label for="DOB">DATE OF BIRTH:</label>
                <input id="dob" name="DOB" type="date" required>//adityakrishnasharma4-eng-patch-1
                
                <label for="phone">PHONE:</label>
                <input id="phone" name="phone" type="number" required>

                <label for="male">Gender:</label>
                <input id="gender" name="male" type="radio" value="Male" required>
                <input id="gender" name="female" type="radio" value="female" required>
           




                


            </forms>
